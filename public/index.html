<!DOCTYPE html>
<html>
<head>
    <title>Groove Galaxy - Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Segoe UI', 'Arial', monospace;
            background: #0a0a1a;
            min-height: 100vh;
            padding: 2rem;
            background-image: 
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            background-color: #0a0e1a;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(10, 20, 40, 0.95);
            border-radius: 0.5rem;
            border: 1px solid #2a4a6a;
            box-shadow: 0 0 20px rgba(0, 100, 200, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0a1628 0%, #1a2a3a 100%);
            color: #8abae0;
            padding: 2rem;
            text-align: center;
            border-bottom: 2px solid #2a5a8a;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 4px;
            color: #c0e0ff;
            text-shadow: 0 0 10px #2a6a9a;
        }

        .header p {
            color: #6a8aa8;
            font-size: 0.9rem;
            font-family: monospace;
        }

        /* Search Bar Section */
        .search-section {
            padding: 1rem 2rem;
            background: #0a1222;
            border-bottom: 1px solid #2a4a6a;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: #0a1428;
            border: 1px solid #2a5a8a;
            border-radius: 0.25rem;
            padding: 0.5rem 1rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #8ac0e8;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }

        .search-box input::placeholder {
            color: #4a6a8a;
        }

        .search-icon {
            color: #4a6a8a;
            margin-right: 0.5rem;
        }

        .clear-search {
            background: #1a2a3a;
            border: 1px solid #3a5a7a;
            color: #8ac0e8;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .clear-search:hover {
            background: #2a3a4a;
            border-color: #5a8aaa;
        }

        .search-stats {
            color: #6a8aaa;
            font-size: 0.7rem;
            font-family: monospace;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 1rem 2rem;
            background: #0a1222;
            border-bottom: 1px solid #2a4a6a;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stat-card {
            text-align: center;
            padding: 0.5rem 1rem;
            background: #0a1428;
            border-radius: 0.25rem;
            border-left: 3px solid #3a7aaa;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #6ac0ff;
            font-family: monospace;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #6a8aaa;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 1.5rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
        }

        th {
            background: #0a1628;
            color: #8ac0e8;
            padding: 1rem 0.75rem;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #2a6a9a;
            letter-spacing: 1px;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid #1a2a3a;
            color: #b0c8e0;
        }

        tr:hover {
            background: rgba(50, 100, 150, 0.2);
        }

        /* Profile Picture Column */
        .player-cell {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .player-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a5a8a, #4a8aba);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .player-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .player-name {
            font-weight: bold;
            color: #7ac0ff;
        }

        .score {
            font-weight: bold;
            color: #6affb0;
            font-size: 1.1rem;
            font-family: monospace;
        }

        .accuracy-high {
            color: #6affb0;
        }

        .accuracy-medium {
            color: #ffcc66;
        }

        .accuracy-low {
            color: #ff8866;
        }

        .footer {
            background: #0a1222;
            padding: 1rem;
            text-align: center;
            color: #5a7a9a;
            font-size: 0.7rem;
            border-top: 1px solid #2a4a6a;
            font-family: monospace;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: #6a8aaa;
            font-family: monospace;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a1222;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a5a8a;
            border-radius: 4px;
        }

        /* Alien Sprite - Top Left (Big) */
        .alien-sprite-left {
            position: fixed;
            top: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            pointer-events: none;
            z-index: 100;
            animation: float 4s ease-in-out infinite;
            background-image: url('aliennormal.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Alien Sprite - Top Right (Big) */
        .alien-sprite-right {
            position: fixed;
            top: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            pointer-events: none;
            z-index: 100;
            animation: float 3.5s ease-in-out infinite reverse;
            background-image: url('alienwater.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Floating animation */
        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        /* Responsive - smaller aliens on mobile */
        @media (max-width: 600px) {
            .alien-sprite-left {
                width: 70px;
                height: 70px;
                top: 10px;
                left: 10px;
            }
            .alien-sprite-right {
                width: 70px;
                height: 70px;
                top: 10px;
                right: 10px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }
            th, td {
                padding: 0.5rem;
                font-size: 0.7rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .stat-number {
                font-size: 1.2rem;
            }
            .player-avatar {
                width: 24px;
                height: 24px;
                font-size: 0.6rem;
            }
            .search-section {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Alien Sprites - Top Left and Top Right only -->
    <div class="alien-sprite-left"></div>
    <div class="alien-sprite-right"></div>

    <div class="container">
        <div class="header">
            <h1>GROOVE GALAXY</h1>
            <p>LEADERBOARD | LIVE DATA STREAM</p>
        </div>

        <!-- Search Bar Section -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="SEARCH CALLSIGN..." autocomplete="off">
            </div>
            <button class="clear-search" id="clear-search">CLEAR</button>
            <div class="search-stats" id="search-stats"></div>
        </div>

        <div class="stats-bar" id="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="total-players">0</div>
                <div class="stat-label">Pilots</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="top-score">0</div>
                <div class="stat-label">High Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avg-accuracy">0%</div>
                <div class="stat-label">Avg Precision</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-runs">0</div>
                <div class="stat-label">Missions</div>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>RANK</th>
                        <th>CALLSIGN</th>
                        <th>SCORE</th>
                        <th>PRECISION</th>
                        <th>STREAK</th>
                        <th>HITS</th>
                        <th>MISSES</th>
                        <th>WAVES</th>
                        <th>DURATION</th>
                        <th>STAMP</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="10">[ ACQUIRING DATA STREAM ... ]</td></tr>
                </tbody>
            </table>
        </div>
        <div class="footer">
            [ AUTO-UPDATING | SORTED BY SCORE | LIVE FROM DEEP SPACE ]
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDC7JYMnG7qZJaeHd7y3IgXbcYyiTmfdfI",
            authDomain: "groove-galaxy-6d5c7.firebaseapp.com",
            databaseURL: "https://groove-galaxy-6d5c7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "groove-galaxy-6d5c7",
            storageBucket: "groove-galaxy-6d5c7.firebasestorage.app",
            messagingSenderId: "603416128744",
            appId: "1:603416128744:web:3049644d65630d7ff72d5d"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const scoresRef = database.ref('/leaderboard/scores');

        let allScores = [];
        let currentSearchTerm = '';

        function formatTimestamp(timestamp) {
            if (!timestamp) return 'N/A';
            const date = timestamp.toString().length === 10 
                ? new Date(timestamp * 1000) 
                : new Date(timestamp);
            return date.toLocaleString();
        }

        function getAccuracyClass(accuracy) {
            if (accuracy >= 0.8) return 'accuracy-high';
            if (accuracy >= 0.5) return 'accuracy-medium';
            return 'accuracy-low';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.charAt(0).toUpperCase();
        }

        function getAvatarColor(name) {
            const colors = ['#2a5a8a', '#4a8aba', '#6a5a8a', '#8a6a5a', '#5a8a6a'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = ((hash << 5) - hash) + name.charCodeAt(i);
                hash |= 0;
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function getAvatarHtml(name) {
            const initial = getInitials(name);
            const bgColor = getAvatarColor(name);
            return `
                <div class="player-avatar" style="background: ${bgColor};">
                    ${initial}
                </div>
            `;
        }

        function renderTable(scores) {
            const tableBody = document.getElementById('table-body');
            
            if (!scores || scores.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="10" class="no-results">[ NO MATCHING CALLSIGNS ]</td></tr>';
                document.getElementById('search-stats').innerHTML = '';
                return;
            }

            const filteredScores = currentSearchTerm 
                ? scores.filter(entry => 
                    entry.name.toLowerCase().startsWith(currentSearchTerm.toLowerCase())
                  ).sort((a, b) => a.name.localeCompare(b.name))
                : scores;

            const searchStats = currentSearchTerm 
                ? `FOUND ${filteredScores.length} OF ${scores.length}`
                : '';
            document.getElementById('search-stats').innerHTML = searchStats;

            if (filteredScores.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="10" class="no-results">[ NO MATCHING CALLSIGNS ]</td></tr>';
                return;
            }

            tableBody.innerHTML = filteredScores.map((entry, index) => {
                const accuracyPercent = (entry.accuracy * 100).toFixed(1);
                const accuracyClass = getAccuracyClass(entry.accuracy);
                const rank = scores.findIndex(s => s.id === entry.id) + 1;
                const rankDisplay = rank === 1 ? '[STAR]' : rank === 2 ? '[NOVA]' : rank === 3 ? '[PULSAR]' : ' ' + rank;
                
                return `
                    <tr>
                        <td>${rankDisplay}</td>
                        <td>
                            <div class="player-cell">
                                ${getAvatarHtml(entry.name)}
                                <span class="player-name">${escapeHtml(entry.name)}</span>
                            </div>
                        </td>
                        <td class="score">${entry.score.toLocaleString()}</td>
                        <td class="${accuracyClass}">${accuracyPercent}%</td>
                        <td>${entry.longestStreak}</td>
                        <td>${entry.promptsHit}</td>
                        <td>${entry.promptsMissed}</td>
                        <td>${entry.sequencesCompleted || 0}</td>
                        <td>${entry.runDuration || 0}s</td>
                        <td>${formatTimestamp(entry.timestamp)}</td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats(scores) {
            const uniquePlayers = new Set(scores.map(s => s.name));
            const topScore = scores.length > 0 ? Math.max(...scores.map(s => s.score)) : 0;
            const avgAccuracy = scores.length > 0 
                ? (scores.reduce((sum, s) => sum + s.accuracy, 0) / scores.length * 100).toFixed(1) 
                : 0;
            const totalRuns = scores.length;

            document.getElementById('total-players').innerText = uniquePlayers.size;
            document.getElementById('top-score').innerText = topScore;
            document.getElementById('avg-accuracy').innerText = avgAccuracy + '%';
            document.getElementById('total-runs').innerText = totalRuns;
        }

        scoresRef.on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                allScores = [];
                updateStats([]);
                renderTable([]);
                return;
            }

            allScores = Object.entries(data).map(([id, entry]) => ({
                id,
                name: entry.name || 'Unknown',
                score: entry.score || 0,
                accuracy: entry.accuracy || 0,
                longestStreak: entry.longestStreak || 0,
                promptsHit: entry.promptsHit || 0,
                promptsMissed: entry.promptsMissed || 0,
                sequencesCompleted: entry.sequencesCompleted || 0,
                runDuration: entry.runDuration || 0,
                timestamp: entry.timestamp || null
            })).sort((a, b) => b.score - a.score);

            updateStats(allScores);
            renderTable(allScores);
            console.log(`Leaderboard synced: ${allScores.length} entries`);
        }, (error) => {
            console.error("Database error:", error);
            document.getElementById('table-body').innerHTML = `
                <tr><td colspan="10" style="color: #ff8866;">
                    [ ERROR: ${error.message} | CHECK CONNECTION ]
                </td></tr>
            `;
        });

        const searchInput = document.getElementById('search-input');
        const clearButton = document.getElementById('clear-search');

        searchInput.addEventListener('input', (e) => {
            currentSearchTerm = e.target.value;
            renderTable(allScores);
        });

        clearButton.addEventListener('click', () => {
            searchInput.value = '';
            currentSearchTerm = '';
            renderTable(allScores);
            searchInput.focus();
        });
    </script>
</body>
</html>
